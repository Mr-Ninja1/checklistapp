
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Food Handlers Daily Handwashing Tracking Log Sheet</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; color: #111; padding: 16px; }
  .form-title { text-align: center; font-size: 20px; font-weight: 900; margin-bottom: 12px; color: #0B4F8C; }
  .header-block { display: flex; align-items: center; margin-bottom: 12px; }
  .logo { height: 36px; margin-right: 12px; object-fit: contain; }
  .meta { font-size: 13px; margin-left: auto; color: #333; }
  .detail-row { margin-bottom: 8px; }
  .label { font-weight: 700; color: #185a9d; margin-right: 8px; }
  .sign-box { width: 160px; height: 60px; border: 1px solid #888; display: inline-block; vertical-align: middle; }
  table.data { width: 100%; border-collapse: collapse; margin-top: 12px }
  table.data th, table.data td { border: 1px solid #ccc; padding: 6px; font-size: 12px; text-align: center; }
  th { background: #f6f9fb; font-weight: 800; color: #0B4F8C; }
  .checkbox { display:inline-block; width: 14pt; height: 14pt; border: 1.2pt solid #444; vertical-align: middle; margin-right: 4pt; box-sizing: border-box; position: relative; }
  .checked { background: #fff; }
  .checked:after { content: '✓'; position: absolute; left: 1pt; top: -1pt; font-size: 11pt; line-height: 14pt; color: #000; font-weight: 800; }
  table.data, .data tbody, .data tr { page-break-inside: avoid !important; }
  .header-block, .detail-row, .form-title { page-break-inside: avoid !important; }
</style>
</head>
<body>
<div class="form-title">Food Handlers Daily Handwashing Tracking Log Sheet</div>
<div class="header-block">
  <!-- {{logoDataUri}} -->
  <div class="meta">
    <span class="label">Date:</span> <!-- {{date}} -->
    <span class="label">Location:</span> <!-- {{location}} -->
    <span class="label">Shift:</span> <!-- {{shift}} -->
  </div>
</div>
<div class="detail-row">
  <span class="label">Verified By:</span> <!-- {{verifiedBy}} -->
  <span class="label">Complex Manager Sign:</span> <!-- {{complexManagerSign}} -->
</div>
<table class="data">
  <thead>
    <tr>
      <th>S/N</th>
      <th>Full Name</th>
      <th>Job Title</th>
      <!-- {{timeSlotsHeaders}} -->
      <th>Staff Sign</th>
      <th>Sup Name</th>
      <th>Sup Sign</th>
    </tr>
  </thead>
  <tbody>
    <!-- {{handlersRows}} -->
  </tbody>
</table>
<div style="margin-top:16px;font-size:11px;color:#0B4F8C;text-align:center;">All food handlers are required to wash and sanitize their hands after every 60 minutes.</div>
</body>
</html>
